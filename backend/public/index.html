async function liveModuleLoad() {
  const cfg = LIVE_MODULES[state.page];
  if (!cfg) return;
  const listKey = { capa: 'records', risk: 'risks', audit: 'plans', iso: 'clauses', hrm: 'requisitions', production: 'orders', procurement: 'requisitions', inventory: 'items' }[cfg.kind];
  const statusEl = $('liveModStatus'); const tableEl = $('liveModTable'); const metricsEl = $('liveModMetrics');
  const listRes = await api(cfg.listUrl);
  if (!listRes) {
    if (statusEl) statusEl.textContent = 'API OFFLINE';
    if (tableEl) tableEl.innerHTML = '<div class="v5Empty">Backend API connected হয়নি। Settings → API Base পরীক্ষা করুন।</div>';
    if (metricsEl) metricsEl.innerHTML = '';
    return;
  }
  if (statusEl) statusEl.textContent = 'API CONNECTED';
  const rows = listRes[listKey] || [];
  if (tableEl) {
    const hasAction = !!cfg.statusAction;
    tableEl.innerHTML = rows.length
      ? `<table class="liveTable"><thead><tr>${cfg.columns.map((c) => `<th>${esc(c[1])}</th>`).join('')}${hasAction ? '<th>Quick Action</th>' : ''}</tr></thead><tbody>${rows.map((r) => `<tr>${cfg.columns.map((c) => `<td>${esc(r[c[0]] ?? '—')}</td>`).join('')}${hasAction ? `<td>${cfg.statusAction.options
        ? `<select data-action-select="${r.id}">${cfg.statusAction.options.map((o) => `<option value="${esc(o)}"${o === r[cfg.statusAction.statusField] ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select><button data-action-apply="${r.id}">Apply</button>`
        : `<input data-action-input="${r.id}" placeholder="${esc(cfg.statusAction.label)}" /><button data-action-apply="${r.id}">Apply</button>`
      }</td>` : ''}</tr>`).join('')}</tbody></table>`
      : '<div class="v5Empty">No records yet.</div>';
    bindActionButtons();
  }
  if (cfg.dashUrl && metricsEl) {
    const dash = await api(cfg.dashUrl);
    if (dash) {
      const entries = Object.entries(dash).filter(([, v]) => typeof v === 'number' || typeof v === 'string').slice(0, 4);
      metricsEl.innerHTML = entries.map(([k, v]) => metric(k.replace(/_/g, ' '), String(v), '', '◉')).join('') || '';
    } else {
      metricsEl.innerHTML = '';
    }
  } else if (metricsEl) {
    metricsEl.innerHTML = metric('Total Records', String(rows.length), cfg.title, '◉');
  }
}

function bindActionButtons() {
  const cfg = LIVE_MODULES[state.page];
  const tableEl = $('liveModTable');
  if (!tableEl || !cfg || !cfg.statusAction) return;
  tableEl.querySelectorAll('[data-action-apply]').forEach((btn) => {
    btn.onclick = async () => {
      const id = btn.dataset.actionApply;
      const sa = cfg.statusAction;
      let body;
      if (sa.options) {
        const select = tableEl.querySelector(`[data-action-select="${id}"]`);
        body = { [sa.statusField]: select ? select.value : undefined };
      } else {
        const input = tableEl.querySelector(`[data-action-input="${id}"]`);
        body = { [sa.bodyField]: input ? input.value : '' };
      }
      const r = await api(sa.url(id), { method: sa.method, body: JSON.stringify(body) });
      toast(r ? 'আপডেট হয়েছে' : 'Backend API unavailable — update failed');
      if (r) liveModuleLoad();
    };
  });
}

function liveModuleBind() {
  const cfg = LIVE_MODULES[state.page];
  if (!cfg) return;
  document.querySelector('[data-live-refresh]')?.addEventListener('click', () => liveModuleLoad());
  const form = $('liveModForm');
  if (form) form.onsubmit = async (e) => {
    e.preventDefault();
    const body = {};
    for (const f of cfg.createFields) {
      const el = form.querySelector(`[name="${f.name}"]`);
      if (el && el.value !== '') body[f.name] = f.type === 'number' ? Number(el.value) : el.value;
    }
    const postUrl = { capa: '/api/capa', risk: '/api/risk', audit: '/api/audit-management/plans', iso: '/api/iso-management/clauses', hrm: '/api/hrm/requisitions', production: '/api/production/orders', procurement: '/api/procurement/requisitions', inventory: '/api/inventory/items' }[cfg.kind];
    const r = await api(postUrl, { method: 'POST', body: JSON.stringify(body) });
    toast(r ? 'সংরক্ষিত হয়েছে' : 'Backend API unavailable — save failed');
    if (r) { form.reset(); liveModuleLoad(); }
  };
  // Table doesn't exist yet on this first call (liveModuleLoad hasn't populated it) — the
  // Apply buttons get bound from inside liveModuleLoad itself, every time it refreshes the table.
}

function sectionPage(){return `<div class="heroX"><div><span class="eyebrowX">SECTION CONTROL</span><h2>🏢 ${esc(state.section||'Section')}</h2><p>Section-level operational dashboard, checklist, task queue, documents and KPI.</p></div><div class="orb">▦</div></div><div class="xmetrics">${metric('Section','ACTIVE',state.section||'Selected section','▦')}${metric('Tasks',num(state.tasks.filter(t=>t.section===state.section).length),'Assigned workflow','✓')}${metric('Checklist','READY','ISO / regular updates','☑')}${metric('Documents',num(state.files.length),'Evidence repository','📁')}</div><div class="dashGrid">${checklist((state.section||'Section')+' Smart Checklist')}<div class="cardX"><div class="cardHead"><h3>Department Workflow</h3><span>MONITORING</span></div>${bars([{k:'Plan',v:92},{k:'Execution',v:87},{k:'Quality',v:95},{k:'Compliance',v:98}])}</div></div>`}
function designationPage(){const title=state.designation||'Designation';return `<div class="heroX"><div><span class="eyebrowX">564 DESIGNATION MASTER</span><h2>👤 ${esc(title)}</h2><p>Department → Section → Designation responsibility chain with job purpose, authority, competency, KPI, evidence and evaluation controls.</p></div><div class="orb">👤</div></div><div class="xmetrics">${metric('Designation','MASTER',state.designation||'Selected','👤')}${metric('Responsibility','MAPPED','ISO / operational','✓')}${metric('KPI','100 MARKS','Performance model','📊')}${metric('Checklist','READY','Daily / weekly / monthly','☑')}</div><div class="dashGrid"><div class="cardX"><div class="cardHead"><h3>Job Responsibility Framework</h3><span>CONTROLLED</span></div><div class="respList">Daily duties · Quality & safety · Documentation · Escalation · Team coordination · KPI submission · Corrective action · Management reporting</div></div>${checklist((state.designation||'Designation')+' Responsibility Checklist')}</div>`}
function liveDashboardPage(){return `<div class="liveDash" id="liveDash"><canvas aria-label="RIZVI FOMS live aquarium dashboard animation"></canvas><div class="liveDashOverlay"><div class="liveDashTop"><div class="liveBrand"><b>RIZVI FOMS · LIVE OPERATIONS</b><small>Corporate Command Center · Real-time visual status stream</small></div><div class="liveControls"><button data-theme="fountain" class="active">💧 Fountain</button><button data-theme="ocean">🌊 Ocean</button><button data-theme="lotus">🪷 Lotus</button><button data-theme="rainbow">🌈 Rainbow</button><button data-theme="sunflower">🌻 Sunflower</button><button data-theme="galaxy">🌌 Galaxy</button><button id="voiceBtn">🔊 Voice</button><button id="pauseBtn">⏸ বিরতি</button><button data-cycle="10">10m</button><button data-cycle="15">15m</button><button id="refreshDemo">↻ Next</button></div></div><div class="liveStats">${[['Tasks','2,845'],['KPI','96.7%'],['Attendance','10,256'],['Documents','15,368'],['Audits','234'],['CAPA','156']].map(x=>`<div class="liveStat"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('')}</div><div class="liveSpeech"><b>🌹 <span id="liveFlowerName">গোলাপ</span> · <span id="liveThemeLabel">Water Fountain</span></b><div id="liveSpeechText">স্যার আসসালামু আলাইকুম, স্যার আপনি কেমন আছেন? আমি ভালো আছি আলহামদুলিল্লাহ। আমি এখন আপনাকে আজকের অপারেশন ম্যানেজমেন্ট সিস্টেমের এখন পর্যন্ত আপডেট দিতে এসেছি।</div><div class="liveVoice">● <span id="voiceState">কণ্ঠ বন্ধ</span> · প্রতিটি ফুলের আগমনে বাংলা status narration</div></div><div class="liveLegend"><span>🐟 হাজার হাজার রঙিন মাছ · status stream</span><span>🫧 <b id="liveUpdates">1,000</b> bubble updates collected</span><span>⏱ Flower cycle: <b id="cycleLabel">12 min</b></span></div></div></div>`}
function settingsPage(){return `<div class="heroX"><div><span class="eyebrowX">SYSTEM CONTROL</span><h2>⚙️ SETTINGS <b>& SYNC</b></h2><p>Configure API endpoint, automatic synchronization and display controls.</p></div><div class="orb">⚙</div></div><div class="dashGrid"><div class="cardX"><div class="cardHead"><h3>Backend/API Connection</h3><span>${state.apiOnline?'CONNECTED':'NOT CONNECTED'}</span></div><div class="formX"><input id="apiBase" value="${esc(RIZVI_CONFIG.API_BASE||'')}" placeholder="https://your-api.example.com"><button class="goldBtn" data-save-api>Save API & Test</button><p class="muted">The API must expose /api/auth, /api/employees, /api/attendance, /api/salary, /api/kpi and /api/ops.</p></div></div><div class="cardX"><div class="cardHead"><h3>Sync Controls</h3><span>AUTOMATIC</span></div><label class="switchRow"><input id="tickerSet" type="checkbox" ${state.settings.ticker?'checked':''}> Live ticker</label><label class="switchRow"><input id="roseSet" type="checkbox" ${state.settings.rose?'checked':''}> Living dashboard animation</label><button class="outlineBtn" data-force-sync>Force Sync Now</button></div></div>`}
function render(){buildSidebar();$('kicker').textContent='RIZVIWORLD · '+(state.page==='dashboard'?'EXECUTIVE CONTROL':'OPERATIONAL CONTROL');$('title').textContent=pageTitle();if(window.RIZVI_LIVE_STOP)window.RIZVI_LIVE_STOP();let html=state.page==='dashboard'?dashboard():state.page==='corporate'?corporatePage():state.page==='department'?departmentPage():state.page==='liveDashboard'?liveDashboardPage():ENTERPRISE_V5_MODULES.some(x=>x[0]===state.page)?v5ModulePage():LIVE_MODULES[state.page]?liveModulePage():state.page==='m21'?documentPage():state.page==='m39'?taskPage():state.page==='m05'?attendancePage():state.page==='m45'?settingsPage():state.page==='section'?sectionPage():state.page==='designation'?designationPage():genericModule();$('page').innerHTML=html;bind();if(ENTERPRISE_V5_MODULES.some(x=>x[0]===state.page)){v5Bind();const key={v01:'corporate',v02:'tracking',v03:'production',v04:'inventory',v05:'traceability',v06:'procurement',v07:'fabrics',v08:'marketing',v09:'iso'}[state.page];if(key)v5LoadEvents(key);}if(LIVE_MODULES[state.page]){liveModuleBind();liveModuleLoad();}document.body.classList.toggle('admin-mode',state.role==='admin');if(state.page==='liveDashboard')setTimeout(()=>window.initRizviLiveDashboard&&window.initRizviLiveDashboard(),0)}
function bind(){document.querySelectorAll('[data-save-check]').forEach(b=>b.onclick=()=>{const key=state.page+'|'+(state.section||state.designation||'main');state.checks=state.checks||{};state.checks[key]=[...document.querySelectorAll('[data-check]')].map(x=>x.checked);persist();toast('Checklist synchronized')});const tf=$('taskForm');if(tf)tf.onsubmit=async e=>{e.preventDefault();const t={id:crypto.randomUUID(),title:$('taskTitle').value,priority:$('taskPriority').value,assignee:$('taskAssignee').value,due:$('taskDue').value,note:$('taskNote').value,status:'created',created_at:new Date().toISOString(),section:state.section||''};state.tasks.push(t);await api('/api/ops/tasks',{method:'POST',body:JSON.stringify(t)});await persist();tf.reset();render();toast('Task created & synchronized')};const af=$('attendanceForm');if(af)af.onsubmit=async e=>{e.preventDefault();const body={employee_id:$('attEmp').value,date:$('attDate').value,status:$('attStatus').value,check_in:$('attIn').value,check_out:$('attOut').value,ot_hours:$('attOt').value};const r=await api('/api/attendance',{method:'POST',body:JSON.stringify(body)});if(!r&&RIZVI_CONFIG.API_BASE)toast('Backend save failed — check API/permission');else{await persist();toast(r?'Attendance saved to backend':'Attendance queued locally')}};const rb=document.querySelector('[data-reconcile]');if(rb)rb.onclick=async()=>{const month=new Date().toISOString().slice(0,7);const r=await api('/api/salary/reconciliation/'+month);$('recon').innerHTML=r?`<p class="okText">${r.total} records · ${r.mismatches} require review.</p>`:'API not connected';};const sb=document.querySelector('[data-salary-import]');if(sb)sb.onclick=async()=>{const f=$('salaryFile').files[0],month=$('salaryMonth').value;if(!f||!month)return toast('Month এবং salary file দিন');if(!RIZVI_CONFIG.API_BASE)return toast('API Base configure করুন');const fd=new FormData();fd.append('file',f);fd.append('month',month);try{const r=await fetch(apiUrl('/api/salary/import'),{method:'POST',headers:state.apiToken?{Authorization:'Bearer '+state.apiToken}:{},body:fd});toast(r.ok?'Salary imported successfully':'Salary import failed')}catch(e){toast('Salary API unavailable')}};document.querySelector('[data-save-api]')?.addEventListener('click',async()=>{RIZVI_CONFIG.API_BASE=$('apiBase').value.trim().replace(/\/$/,'');localStorage.setItem('rizvi_api_base',RIZVI_CONFIG.API_BASE);const r=await api('/api/health');toast(r?'API connected':'API connection failed');render()});document.querySelector('[data-force-sync]')?.addEventListener('click',async()=>{await persist();await pull();toast('Synchronization cycle completed')});document.querySelectorAll('[data-section-jump]').forEach(b=>b.onclick=()=>{state.page='section';state.section=b.dataset.sectionJump;render()});document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{if(b.dataset.quick==='task')state.page='m39';else if(b.dataset.quick==='check')toast('Open any module for Smart Checklist');else if(b.dataset.quick==='document')state.page='m21';else state.page='m40';render()});const ub=document.querySelector('[data-bulk-upload]');if(ub)ub.onclick=async()=>{const files=[...($('docFiles')?.files||[])];if(!files.length)return toast('কমপক্ষে একটি file নির্বাচন করুন');if(!RIZVI_CONFIG.API_BASE)return toast('Settings থেকে Production API Base configure করুন');const out=$('uploadStatus');out.textContent=`${files.length} টি file প্রস্তুত হচ্ছে...`;let ok=0,fail=0;for(let i=0;i<files.length;i++){const f=files[i];try{out.textContent=`${i+1}/${files.length}: ${f.name} initiate...`;const init=await api('/api/v2/documents/initiate',{method:'POST',body:JSON.stringify({file_name:f.name,content_type:f.type||'application/octet-stream',size_bytes:f.size,module:$('docModule').value,department:$('docDepartment').value,section:$('docSection').value,designation:$('docDesignation').value})});if(!init?.upload_url)throw new Error('signed upload URL পাওয়া যায়নি');const put=await fetch(init.upload_url,{method:'PUT',headers:{'Content-Type':f.type||'application/octet-stream'},body:f});if(!put.ok)throw new Error('cloud upload failed '+put.status);const done=await api('/api/v2/documents/complete',{method:'POST',body:JSON.stringify({upload_id:init.upload_id,object_name:init.object_name,file_name:f.name,content_type:f.type,size_bytes:f.size,module:$('docModule').value,department:$('docDepartment').value,section:$('docSection').value,designation:$('docDesignation').value})});if(!done)throw new Error('finalize failed');ok++}catch(e){console.error(e);fail++}}out.textContent=`Upload complete: ${ok} success, ${fail} failed. Failed files আবার select করে retry করতে পারবেন.`;toast(`${ok} টি file secure upload হয়েছে`);};}
async function login(){const id=$('authIdentity').value.trim(),pw=$('authPassword').value;if(RIZVI_CONFIG.API_BASE){const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({employee_code:id,password:pw})});if(r?.token){state.apiToken=r.token;localStorage.setItem('rizvi_api_token',r.token);state.role=r.user.role;state.auth=r.user;startApp();return}toast('Backend login failed');return}const demo=(id==='demo@rizvi.local'&&pw==='Demo123456');if(!demo){toast('For production login configure API Base in Settings');return}state.role='user';state.auth={id:'u-demo',name:'Demo User',role:'employee'};startApp()}
function startApp(){$('loginScreen').classList.add('hidden');$('app').classList.remove('hidden');state.page='dashboard';render();pull();}
$('authForm').onsubmit=e=>{e.preventDefault();login()};$('menu').onclick=()=>{$('sidebar').classList.toggle('open')};$('logout').onclick=()=>{state.auth=null;state.apiToken='';localStorage.removeItem('rizvi_api_token');$('app').classList.add('hidden');$('loginScreen').classList.remove('hidden')};$('globalSettings').onclick=()=>{state.page='m45';render()};$('topImport').onclick=()=>{state.page='m21';render()};
loadLocal();if(state.auth){};setInterval(()=>{if(state.auth)pull()},RIZVI_CONFIG.POLL_MS);setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('en-GB'),1000);$('clock').textContent=new Date().toLocaleTimeString('en-GB');
